<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="150" r="300" fill="#6366f1" fill-opacity="0.12" filter="blur(60px)"/>
  <circle cx="200" cy="500" r="250" fill="#8b5cf6" fill-opacity="0.12" filter="blur(60px)"/>
  
  <!-- Icono Central Izquierda -->
  <g transform="translate(100, 190)">
    <rect width="120" height="120" rx="28" fill="#6366f1"/>
    <text x="60" y="80" font-family="system-ui, sans-serif" font-size="64" fill="#ffffff" text-anchor="middle">📅</text>
  </g>

  <!-- Textos -->
  <text x="250" y="240" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" fill="#f8fafc">
    Armador de Horarios <tspan fill="url(#textGrad)">Inteligente</tspan>
  </text>
  <text x="250" y="295" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="600" fill="#94a3b8">
    Optimizador Profesional de Horarios Universitarios · UPAO
  </text>

  <!-- Badges / Características -->
  <g transform="translate(250, 360)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="110" y="30" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ 0 Cruces de Horario</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="350" y="30" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#10b981" text-anchor="middle">🔗 Ligas T / P / L UPAO</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="590" y="30" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#c084fc" text-anchor="middle">📱 Exportación PNG / ICS</text>
  </g>

  <!-- Pie -->
  <text x="250" y="470" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" fill="#64748b">
    github.com/alessandrorr1007-debug/armador-horarios
  </text>
</svg>
